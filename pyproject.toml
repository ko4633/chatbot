[project]
name = "omnis"
version = "0.1.0"
description = "OMNIS Personal Intelligence OS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "redis>=5.0",
    "minio>=7.2",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "rapidfuzz>=3.9",
    "typer>=0.12",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["packages*", "apps*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `db: Session = Depends(get_db)` —
# Depends()/Query() calls in argument defaults are evaluated once by
# FastAPI's DI system, not on every request, so B008 does not apply to them.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
exclude = ["apps/web", "legacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
