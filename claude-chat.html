<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부모님 말벗 테스트</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f5f0e8;
    font-family: 'Noto Sans KR', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .wrapper {
    width: 100%;
    max-width: 420px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 700px;
  }

  .header {
    background: #FEE500;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .avatar {
    width: 40px; height: 40px;
    background: #3C1E1E;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }

  .header-info h2 {
    font-size: 15px;
    font-weight: 700;
    color: #1a1a1a;
  }

  .header-info p {
    font-size: 11px;
    color: #666;
  }

  /* API 키 입력 */
  .api-section {
    background: #fff8e1;
    padding: 12px 16px;
    border-bottom: 1px solid #f0e0a0;
    display: flex;
    gap: 8px;
  }

  .api-section input {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    font-family: monospace;
    outline: none;
  }

  .api-section input:focus { border-color: #FEE500; }

  .api-btn {
    background: #3C1E1E;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    font-family: 'Noto Sans KR', sans-serif;
  }

  .api-status {
    text-align: center;
    font-size: 11px;
    padding: 4px;
    color: #888;
  }

  .api-status.ok { color: #2a5f3e; }
  .api-status.err { color: #c8390a; }

  /* 채팅 */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #b2c7d9;
  }

  .msg {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  .msg.user { flex-direction: row-reverse; }

  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.6;
    word-break: break-word;
  }

  .msg.bot .bubble {
    background: white;
    color: #1a1a1a;
    border-bottom-left-radius: 4px;
  }

  .msg.user .bubble {
    background: #FEE500;
    color: #1a1a1a;
    border-bottom-right-radius: 4px;
  }

  .bot-avatar {
    width: 32px; height: 32px;
    background: #3C1E1E;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .typing {
    display: flex;
    gap: 4px;
    padding: 12px 14px;
    background: white;
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    width: fit-content;
  }

  .typing span {
    width: 6px; height: 6px;
    background: #aaa;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  /* 입력 */
  .input-area {
    padding: 12px 16px;
    background: #f8f8f8;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    border-top: 1px solid #eee;
  }

  .input-area textarea {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    resize: none;
    max-height: 100px;
    outline: none;
    line-height: 1.5;
  }

  .input-area textarea:focus { border-color: #FEE500; }

  .send-btn {
    width: 40px; height: 40px;
    background: #FEE500;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }

  .send-btn:hover { background: #f0d800; }
  .send-btn:disabled { background: #eee; cursor: not-allowed; }

  /* 모드 탭 */
  .mode-tabs {
    display: flex;
    background: #3C1E1E;
  }

  .mode-tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    font-size: 13px;
    font-weight: 700;
    color: #cbb;
    cursor: pointer;
    background: transparent;
    border: none;
    font-family: 'Noto Sans KR', sans-serif;
  }

  .mode-tab.active {
    color: #1a1a1a;
    background: #FEE500;
  }

  /* 성격 선택 */
  .persona-bar {
    padding: 8px 16px;
    background: #f0f0f0;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    border-bottom: 1px solid #e0e0e0;
  }

  .persona-btn {
    background: white;
    border: 1px solid #ddd;
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.15s;
  }

  .persona-btn.active {
    background: #3C1E1E;
    color: white;
    border-color: #3C1E1E;
  }

  /* 만화 만들기 */
  .chat-view, .manga-view {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .manga-view { display: none; }
  .manga-view.active { display: flex; }
  .chat-view.hidden { display: none; }

  .manga-controls {
    padding: 12px 16px;
    background: #f8f8f8;
    border-bottom: 1px solid #eee;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .manga-controls textarea {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    resize: none;
    outline: none;
    min-height: 44px;
  }

  .manga-controls textarea:focus { border-color: #FEE500; }

  .manga-key-input {
    margin: 10px 16px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    font-family: monospace;
    outline: none;
  }

  .manga-key-input:focus { border-color: #FEE500; }

  .manga-subtabs {
    display: flex;
    gap: 6px;
    padding: 10px 16px 0;
  }

  .manga-subtab {
    flex: 1;
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
  }

  .manga-subtab.active {
    background: #3C1E1E;
    color: white;
    border-color: #3C1E1E;
  }

  .manga-sub {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .manga-clear-btn {
    background: #999;
  }

  .manga-controls input {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    font-family: monospace;
    outline: none;
  }

  .manga-controls input:focus { border-color: #FEE500; }

  .manga-options {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .manga-options select {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 12px;
    font-family: 'Noto Sans KR', sans-serif;
  }

  .manga-generate-btn {
    background: #3C1E1E;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    margin-left: auto;
  }

  .manga-generate-btn:disabled { background: #aaa; cursor: not-allowed; }

  .manga-result {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    background: #b2c7d9;
  }

  .manga-title {
    font-size: 15px;
    font-weight: 700;
    color: #1a1a1a;
    background: white;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 12px;
    text-align: center;
  }

  .manga-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .manga-panel {
    background: #fffdf5;
    border: 3px solid #3C1E1E;
    border-radius: 8px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .manga-panel .panel-num {
    font-size: 10px;
    color: #999;
    font-weight: 700;
  }

  .manga-panel .panel-scene {
    font-size: 11px;
    color: #666;
    font-style: italic;
    line-height: 1.4;
  }

  .manga-panel .panel-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #eee;
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #888;
    text-align: center;
    padding: 6px;
  }

  .manga-panel .panel-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .manga-panel .panel-dialogue {
    background: white;
    border: 2px solid #333;
    border-radius: 12px;
    padding: 6px 10px;
    font-size: 12px;
    line-height: 1.4;
    position: relative;
  }

  .manga-empty {
    text-align: center;
    color: #4a5a68;
    font-size: 13px;
    padding: 40px 20px;
  }

  .manga-loading {
    text-align: center;
    color: #4a5a68;
    font-size: 13px;
    padding: 40px 20px;
  }
</style>
</head>
<body>
<div class="wrapper">

  <!-- 헤더 -->
  <div class="header">
    <div class="avatar">🐱</div>
    <div class="header-info">
      <h2>창혁이 말벗봇</h2>
      <p>부모님 테스트용</p>
    </div>
  </div>

  <!-- API 키 입력 -->
  <div class="api-section">
    <input type="password" id="apiKey" placeholder="sk-ant-api03-... API 키 붙여넣기" />
    <button class="api-btn" onclick="setKey()">연결</button>
  </div>
  <div class="api-status" id="apiStatus">API 키를 입력하면 대화 시작됩니다</div>

  <!-- 모드 탭 -->
  <div class="mode-tabs">
    <button class="mode-tab active" id="tabChat" onclick="setMode('chat')">💬 말벗 대화</button>
    <button class="mode-tab" id="tabManga" onclick="setMode('manga')">🎨 만화 만들기</button>
  </div>

  <!-- 대화 화면 -->
  <div class="chat-view" id="chatView">

    <!-- 성격 선택 -->
    <div class="persona-bar">
      <button class="persona-btn active" onclick="setPersona(this, 'son')">👦 아들 말투</button>
      <button class="persona-btn" onclick="setPersona(this, 'friend')">😊 친근한 친구</button>
      <button class="persona-btn" onclick="setPersona(this, 'formal')">🎩 정중한 도우미</button>
      <button class="persona-btn" onclick="setPersona(this, 'grandson')">👶 손주 말투</button>
    </div>

    <!-- 메시지 -->
    <div class="messages" id="messages">
      <div class="msg bot">
        <div class="bot-avatar">🐱</div>
        <div class="bubble">안녕하세요 어머니~ 오늘 하루 어떠셨어요? 😊</div>
      </div>
    </div>

    <!-- 입력 -->
    <div class="input-area">
      <textarea id="userInput" placeholder="메시지 입력..." rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"
        oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMsg()">➤</button>
    </div>

  </div>

  <!-- 만화 만들기 화면 -->
  <div class="manga-view" id="mangaView">

    <input type="password" id="openaiKey" class="manga-key-input" placeholder="이미지 생성용 OpenAI API 키 (sk-...) 붙여넣기" />

    <!-- 만화 서브 탭 -->
    <div class="manga-subtabs">
      <button class="manga-subtab active" id="subtabAuto" onclick="setMangaSubmode('auto')">📖 자동 생성</button>
      <button class="manga-subtab" id="subtabManual" onclick="setMangaSubmode('manual')">✏️ 한 컷씩 만들기</button>
    </div>

    <!-- 자동 생성: 주제만 주면 스토리+컷 전체를 알아서 -->
    <div class="manga-sub" id="mangaAuto">
      <div class="manga-controls">
        <textarea id="mangaTopic" rows="2" placeholder="어떤 만화를 그리고 싶으세요? 예) 고양이가 처음 눈을 본 이야기"></textarea>
        <div class="manga-options">
          <select id="mangaPanelCount">
            <option value="4">4컷</option>
            <option value="6">6컷</option>
            <option value="8">8컷</option>
          </select>
          <select id="mangaGenre">
            <option value="따뜻하고 잔잔한 일상">일상</option>
            <option value="유쾌하고 웃긴">코미디</option>
            <option value="뭉클하고 감동적인">감동</option>
            <option value="상상력 넘치는 판타지">판타지</option>
          </select>
          <button class="manga-generate-btn" id="mangaGenBtn" onclick="generateManga()">만화 생성</button>
        </div>
      </div>

      <div class="manga-result" id="mangaResult">
        <div class="manga-empty">주제를 입력하고 '만화 생성'을 눌러보세요 🎨</div>
      </div>
    </div>

    <!-- 한 컷씩 만들기: 씬을 직접 설명하면 그 장면 하나를 컷으로 -->
    <div class="manga-sub" id="mangaManual" style="display:none;">
      <div class="manga-controls">
        <textarea id="sceneInput" rows="2" placeholder="이번 컷 장면을 설명해주세요. 예) 고양이가 창밖에 내리는 눈을 보고 앞발을 창문에 갖다 댄다"></textarea>
        <input type="text" id="sceneDialogue" placeholder="대사 (선택, 없으면 비워두세요)" />
        <div class="manga-options">
          <button class="manga-generate-btn" id="sceneGenBtn" onclick="addManualPanel()" style="margin-left:0;">컷 그리기</button>
          <button class="manga-generate-btn manga-clear-btn" onclick="clearManualPanels()">전체 지우기</button>
        </div>
      </div>

      <div class="manga-result" id="manualResult">
        <div class="manga-empty" id="manualEmpty">장면을 설명하고 '컷 그리기'를 누르면, 컷이 하나씩 쌓여서 만화가 됩니다 🎨</div>
        <div class="manga-grid" id="manualGrid"></div>
      </div>
    </div>

  </div>

</div>

<script>
let apiKey = '';
let history = [];
let currentPersona = 'son';

const personas = {
  son: `당신은 창혁이라는 30대 경상도 아들입니다. 부모님(58년생 아버지, 60년생 어머니)과 카카오톡으로 대화합니다.
경상도 사투리를 자연스럽게 쓰세요. 예: "어예~", "머하노~", "밥은 묵었나~", "아이고~", "와~", "그카면 안되지~", "맞다 아이가~", "니 요새 어떻노~"
따뜻하고 살가운 경상도 아들 말투로, 이모지도 가끔 쓰세요.
답변은 2~3문장 이내로 짧고 자연스럽게.`,

  friend: `당신은 60대 어르신의 친근한 경상도 친구입니다.
"야~", "인자~", "와 그라노~", "맞제~" 같은 경상도 사투리로 편하게 대화하세요.
짧고 따뜻하게 답하세요.`,

  formal: `당신은 어르신을 위한 정중한 AI 도우미입니다. 
존댓말을 쓰고 친절하게 안내해드리세요. 어려운 단어는 피하고 쉽게 설명해주세요.`,

  grandson: `당신은 경상도 손주입니다. 할머니 할아버지께 귀엽고 사랑스럽게 대화하세요.
"할매~", "할배~", "머하고 계시노~", "보고 싶다 아이가~" 같은 경상도 손주 말투로 밝게 대화하세요. 짧게 답하세요.`
};

function setKey() {
  const input = document.getElementById('apiKey').value.trim();
  const status = document.getElementById('apiStatus');
  if (!input.startsWith('sk-ant-')) {
    status.textContent = '❌ 올바른 API 키가 아니에요 (sk-ant-로 시작해야 함)';
    status.className = 'api-status err';
    return;
  }
  apiKey = input;
  status.textContent = '✅ 연결됐어요! 이제 대화해보세요';
  status.className = 'api-status ok';
  document.getElementById('apiKey').value = '●●●●●●●●●●●●';
}

function setPersona(btn, persona) {
  document.querySelectorAll('.persona-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentPersona = persona;
  history = [];
  const msgs = document.getElementById('messages');
  msgs.innerHTML = '<div class="msg bot"><div class="bot-avatar">🐱</div><div class="bubble">안녕하세요~ 말투를 바꿨어요 😊 다시 대화해볼까요?</div></div>';
}

async function sendMsg() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  if (!apiKey) {
    alert('먼저 API 키를 입력하고 연결 버튼을 눌러주세요!');
    return;
  }

  // 유저 메시지
  addMsg('user', text);
  input.value = '';
  input.style.height = 'auto';
  history.push({ role: 'user', content: text });

  // 타이핑 표시
  const typingId = addTyping();
  document.getElementById('sendBtn').disabled = true;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 300,
        system: personas[currentPersona],
        messages: history
      })
    });

    const data = await res.json();
    removeTyping(typingId);

    if (!res.ok || data.error) {
      addMsg('bot', '❌ 오류: ' + (data.error ? data.error.message : res.status));
      history.pop();
    } else {
      const reply = data.content[0].text;
      addMsg('bot', reply);
      history.push({ role: 'assistant', content: reply });
    }
  } catch (e) {
    removeTyping(typingId);
    addMsg('bot', '❌ 연결 오류가 났어요. API 키 확인해주세요.');
    history.pop();
  }

  document.getElementById('sendBtn').disabled = false;
}

function addMsg(role, text) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = role === 'bot'
    ? `<div class="bot-avatar">🐱</div><div class="bubble">${text.replace(/\n/g,'<br>')}</div>`
    : `<div class="bubble">${text.replace(/\n/g,'<br>')}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function addTyping() {
  const msgs = document.getElementById('messages');
  const id = 'typing-' + Date.now();
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = id;
  div.innerHTML = `<div class="bot-avatar">🐱</div><div class="typing"><span></span><span></span><span></span></div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return id;
}

function removeTyping(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function setMode(mode) {
  const chatView = document.getElementById('chatView');
  const mangaView = document.getElementById('mangaView');
  const tabChat = document.getElementById('tabChat');
  const tabManga = document.getElementById('tabManga');

  if (mode === 'manga') {
    chatView.classList.add('hidden');
    mangaView.classList.add('active');
    tabChat.classList.remove('active');
    tabManga.classList.add('active');
  } else {
    chatView.classList.remove('hidden');
    mangaView.classList.remove('active');
    tabChat.classList.add('active');
    tabManga.classList.remove('active');
  }
}

const MANGA_ART_STYLE = 'black and white Korean webtoon manhwa panel illustration, clean bold ink linework, high-contrast monochrome, no gray screentone, expressive dramatic line art, digital comic art, no text or letters or watermark in the image';

function setMangaSubmode(mode) {
  const auto = document.getElementById('mangaAuto');
  const manual = document.getElementById('mangaManual');
  const subtabAuto = document.getElementById('subtabAuto');
  const subtabManual = document.getElementById('subtabManual');

  if (mode === 'manual') {
    auto.style.display = 'none';
    manual.style.display = 'flex';
    subtabAuto.classList.remove('active');
    subtabManual.classList.add('active');
  } else {
    auto.style.display = 'flex';
    manual.style.display = 'none';
    subtabAuto.classList.add('active');
    subtabManual.classList.remove('active');
  }
}

let manualPanelIndex = 0;

async function addManualPanel() {
  const sceneInput = document.getElementById('sceneInput');
  const scene = sceneInput.value.trim();
  const dialogue = document.getElementById('sceneDialogue').value.trim();
  const openaiKey = document.getElementById('openaiKey').value.trim();
  const genBtn = document.getElementById('sceneGenBtn');
  const grid = document.getElementById('manualGrid');
  const emptyEl = document.getElementById('manualEmpty');

  if (!scene) {
    alert('이번 컷의 장면을 설명해주세요!');
    return;
  }
  if (!openaiKey.startsWith('sk-')) {
    alert('그림 생성을 위해 OpenAI API 키(sk-...)를 입력해주세요!');
    return;
  }

  emptyEl.style.display = 'none';

  const idx = manualPanelIndex++;
  const panelDiv = document.createElement('div');
  panelDiv.className = 'manga-panel';
  panelDiv.innerHTML = `
    <div class="panel-num">#${idx + 1}</div>
    <div class="panel-scene">${escapeHtml(scene)}</div>
    <div class="panel-image" id="manualImg${idx}">그림 그리는 중...</div>
    <div class="panel-dialogue">${escapeHtml(dialogue)}</div>`;
  grid.appendChild(panelDiv);

  sceneInput.value = '';
  document.getElementById('sceneDialogue').value = '';
  genBtn.disabled = true;
  genBtn.textContent = '그리는 중...';

  try {
    const b64 = await generatePanelImage(openaiKey, scene);
    document.getElementById(`manualImg${idx}`).innerHTML = `<img src="data:image/png;base64,${b64}" alt="cut ${idx + 1}">`;
  } catch (err) {
    document.getElementById(`manualImg${idx}`).textContent = '이미지 생성 실패';
  }

  genBtn.disabled = false;
  genBtn.textContent = '컷 그리기';
}

function clearManualPanels() {
  document.getElementById('manualGrid').innerHTML = '';
  document.getElementById('manualEmpty').style.display = 'block';
  manualPanelIndex = 0;
}

async function generateManga() {
  const topicInput = document.getElementById('mangaTopic');
  const topic = topicInput.value.trim();
  const panelCount = document.getElementById('mangaPanelCount').value;
  const genre = document.getElementById('mangaGenre').value;
  const openaiKey = document.getElementById('openaiKey').value.trim();
  const resultEl = document.getElementById('mangaResult');
  const genBtn = document.getElementById('mangaGenBtn');

  if (!topic) {
    alert('만화 주제를 먼저 입력해주세요!');
    return;
  }
  if (!apiKey) {
    alert('먼저 상단에 Claude API 키를 입력하고 연결 버튼을 눌러주세요!');
    return;
  }
  if (!openaiKey.startsWith('sk-')) {
    alert('그림 생성을 위해 OpenAI API 키(sk-...)를 입력해주세요!');
    return;
  }

  genBtn.disabled = true;
  genBtn.textContent = '대본 쓰는 중...';
  resultEl.innerHTML = '<div class="manga-loading">만화 대본을 쓰고 있어요... 📝</div>';

  const systemPrompt = `당신은 짧은 만화(웹툰) 스토리보드 작가입니다.
사용자의 주제로 ${genre} 분위기의 ${panelCount}컷 만화를 만드세요.
반드시 아래 JSON 형식으로만 응답하세요. 다른 설명은 절대 붙이지 마세요.

{"title": "만화 제목", "panels": [{"scene": "장면 묘사(한 문장, 한국어)", "dialogue": "등장인물 대사(짧게, 한국어)", "imagePrompt": "이 장면을 그릴 AI 이미지 생성용 영어 설명. 인물 외모/행동/배경/분위기를 구체적으로. 글자나 텍스트는 넣지 말 것"}]}

panels 배열의 길이는 정확히 ${panelCount}개여야 합니다.`;

  let manga;
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1500,
        system: systemPrompt,
        messages: [{ role: 'user', content: topic }]
      })
    });

    const data = await res.json();

    if (!res.ok || data.error) {
      resultEl.innerHTML = `<div class="manga-empty">❌ 오류: ${escapeHtml(data.error ? data.error.message : String(res.status))}</div>`;
      genBtn.disabled = false;
      genBtn.textContent = '만화 생성';
      return;
    }

    const raw = data.content[0].text;
    const jsonMatch = raw.match(/\{[\s\S]*\}/);
    manga = JSON.parse(jsonMatch ? jsonMatch[0] : raw);
  } catch (e) {
    resultEl.innerHTML = '<div class="manga-empty">❌ 대본 생성에 실패했어요. 다시 시도해주세요.</div>';
    genBtn.disabled = false;
    genBtn.textContent = '만화 생성';
    return;
  }

  const panels = Array.isArray(manga.panels) ? manga.panels : [];
  renderMangaSkeleton(manga, panels);

  for (let i = 0; i < panels.length; i++) {
    genBtn.textContent = `그림 그리는 중 (${i + 1}/${panels.length})`;
    const imgWrap = document.getElementById(`mangaImg${i}`);
    try {
      const b64 = await generatePanelImage(openaiKey, panels[i].imagePrompt || panels[i].scene || topic);
      if (imgWrap) imgWrap.innerHTML = `<img src="data:image/png;base64,${b64}" alt="panel ${i + 1}">`;
    } catch (err) {
      if (imgWrap) imgWrap.textContent = '이미지 생성 실패';
    }
  }

  genBtn.disabled = false;
  genBtn.textContent = '만화 생성';
}

async function generatePanelImage(openaiKey, prompt) {
  const res = await fetch('https://api.openai.com/v1/images/generations', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${openaiKey}`
    },
    body: JSON.stringify({
      model: 'dall-e-3',
      prompt: `${MANGA_ART_STYLE}. Scene: ${prompt}`,
      n: 1,
      size: '1024x1024',
      quality: 'standard',
      response_format: 'b64_json'
    })
  });

  const data = await res.json();
  if (!res.ok || data.error) {
    throw new Error(data.error ? data.error.message : String(res.status));
  }
  return data.data[0].b64_json;
}

function renderMangaSkeleton(manga, panels) {
  const resultEl = document.getElementById('mangaResult');

  let html = `<div class="manga-title">${escapeHtml(manga.title || '제목 없음')}</div><div class="manga-grid">`;
  panels.forEach((panel, i) => {
    html += `
      <div class="manga-panel">
        <div class="panel-num">#${i + 1}</div>
        <div class="panel-scene">${escapeHtml(panel.scene || '')}</div>
        <div class="panel-image" id="mangaImg${i}">그림 그리는 중...</div>
        <div class="panel-dialogue">${escapeHtml(panel.dialogue || '')}</div>
      </div>`;
  });
  html += '</div>';

  resultEl.innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
