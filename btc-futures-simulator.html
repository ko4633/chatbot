<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>했제와 그랬제</title>
<style>
  :root{
    --bg:#0b0e11; --panel:#161a1e; --panel2:#1e2329; --line:#2b3139;
    --txt:#eaecef; --dim:#848e9c; --up:#20b26c; --dn:#ef454a; --acc:#f7a600;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overscroll-behavior:none;}
  body{
    background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    font-size:13px;letter-spacing:-0.2px;overflow:hidden;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .mono{font-family:'SFMono-Regular',Consolas,'Roboto Mono',monospace;font-variant-numeric:tabular-nums;}
  button{font:inherit;color:inherit;letter-spacing:inherit;}
  #app{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;}
  .screen{display:none;width:100%;height:100%;flex-direction:column;}
  .screen.active{display:flex;}

  /* ---------- MENU ---------- */
  #screen-menu{overflow-y:auto;}
  .menu-wrap{max-width:520px;margin:0 auto;width:100%;padding:28px 18px 60px;}
  .menu-title{font-size:26px;font-weight:800;text-align:center;color:var(--txt);}
  .menu-sub{text-align:center;color:var(--dim);font-size:12.5px;margin-top:8px;line-height:1.6;}
  .balance-card{
    margin-top:22px;background:linear-gradient(135deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:12px;padding:16px 18px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .balance-card .lbl{color:var(--dim);font-size:12px;}
  .balance-card .val{font-size:22px;font-weight:700;margin-top:4px;}
  .balance-card .badge{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:11px;color:var(--acc);}
  .scenario-list{margin-top:22px;display:flex;flex-direction:column;gap:10px;}
  .scenario-card{
    position:relative;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--dn);
    border-radius:8px;padding:13px 14px 13px 16px;cursor:pointer;transition:transform .12s ease;
  }
  .scenario-card:active{transform:scale(.98);}
  .scenario-card.cleared{opacity:.45;border-left-color:var(--line);cursor:default;}
  .scenario-card.locked{opacity:.5;cursor:default;border-left-color:var(--line);}
  .scenario-card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .scenario-card .name{font-weight:700;font-size:14.5px;}
  .scenario-card .dateWrap{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;}
  .scenario-card .date{color:var(--dim);font-size:11px;}
  .scenario-card .desc{color:var(--dim);font-size:11.5px;margin-top:6px;line-height:1.5;}
  .scenario-card .tag{display:inline-block;margin-top:8px;font-size:11px;color:var(--dn);background:rgba(239,69,74,.12);border:1px solid rgba(239,69,74,.35);border-radius:5px;padding:2px 7px;}
  .scenario-card .status{font-size:10px;color:var(--dim);}
  .scenario-card.cleared .status{color:var(--up);}

  /* ---------- GAME ---------- */
  #screen-game{background:var(--bg);}
  .game-header{
    display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);
    background:var(--panel);flex-shrink:0;
  }
  .game-header .backbtn{background:none;border:none;color:var(--dim);font-size:12px;cursor:pointer;flex-shrink:0;}
  .game-header .sym{font-weight:700;font-size:13px;flex-shrink:0;}
  .game-header .price{font-size:16px;font-weight:700;}
  .game-header .pct{font-size:12.5px;font-weight:700;}
  .game-header .spacer{flex:1;}
  .speedbtns{display:flex;gap:4px;flex-shrink:0;}
  .speedbtns button{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:4px 8px;font-size:11px;color:var(--dim);cursor:pointer;}
  .speedbtns button.active{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700;}

  @media (max-width:480px){
    .game-header{gap:6px;padding:6px 8px;}
    .game-header .backbtn{font-size:11px;}
    .game-header .sym{font-size:11px;}
    .game-header .price{font-size:13px;}
    .game-header .pct{font-size:11px;}
    .speedbtns{gap:3px;}
    .speedbtns button{padding:3px 6px;font-size:10px;}
  }

  .game-main{flex:1;display:flex;min-height:0;position:relative;}
  .chart-wrap{flex:1;position:relative;min-width:0;background:var(--bg);}
  #chart{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .flash{position:absolute;inset:0;background:rgba(239,69,74,.38);opacity:0;pointer-events:none;transition:opacity .06s linear;}
  .flash.show{opacity:1;transition:none;}

  .chat-panel{width:220px;flex-shrink:0;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);min-height:0;}
  .chat-head{padding:8px 10px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--dim);display:flex;justify-content:space-between;flex-shrink:0;}
  .chat-head b{color:var(--txt);}
  .chat-list{flex:1;overflow-y:auto;padding:6px 10px;display:flex;flex-direction:column;gap:5px;min-height:0;}
  .chat-line{font-size:11.5px;line-height:1.4;word-break:break-all;color:var(--txt);}
  .chat-line .nick{color:var(--acc);font-weight:700;margin-right:4px;}

  @media (max-width:720px){
    .chat-panel{position:absolute;left:0;right:0;bottom:0;width:auto;height:150px;
      background:rgba(22,26,30,.72);border-left:none;border-top:1px solid var(--line);backdrop-filter:blur(2px);}
  }

  .pos-bar{flex-shrink:0;background:var(--panel);border-top:1px solid var(--line);padding:9px 12px 12px;display:flex;flex-direction:column;gap:8px;}
  .pos-info{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:12px;align-items:baseline;}
  .pos-info .side-tag{font-weight:800;padding:1px 6px;border-radius:4px;font-size:11.5px;}
  .pos-info .side-tag.long{background:rgba(32,178,108,.16);color:var(--up);}
  .pos-info .side-tag.short{background:rgba(239,69,74,.16);color:var(--dn);}
  .pos-info .side-tag.none{background:var(--panel2);color:var(--dim);}
  .pos-info .item .k{color:var(--dim);margin-right:4px;}
  .lev-row{display:flex;align-items:center;gap:10px;}
  .lev-row input[type=range]{flex:1;accent-color:var(--acc);}
  .lev-row .levval{width:44px;text-align:right;font-weight:700;color:var(--acc);flex-shrink:0;}
  .pct-row{display:flex;gap:6px;}
  .pct-row button{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 0;font-size:11.5px;color:var(--dim);cursor:pointer;}
  .pct-row button.active{border-color:var(--acc);color:var(--acc);}
  .action-row{display:grid;grid-template-columns:1fr 84px 1fr;gap:8px;}
  .action-row button{border:none;border-radius:8px;padding:12px 0;font-weight:800;font-size:14px;cursor:pointer;}
  .btn-long{background:var(--up);color:#04140c;}
  .btn-short{background:var(--dn);color:#1a0505;}
  .btn-close{background:var(--panel2);color:var(--txt);border:1px solid var(--line)!important;}
  .action-row button:disabled{opacity:.35;cursor:default;}

  /* ---------- RESULT ---------- */
  #screen-result{align-items:center;justify-content:center;background:var(--bg);}
  .result-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 24px;margin:20px;}
  .result-card h2{text-align:center;font-size:18px;color:var(--dim);font-weight:600;}
  .result-grade{text-align:center;margin:14px 0 4px;}
  .result-grade .g{font-size:52px;font-weight:900;line-height:1;}
  .result-grade .comment{color:var(--dim);font-size:12.5px;margin-top:8px;}
  .result-rows{margin-top:18px;display:flex;flex-direction:column;gap:0;}
  .result-rows .rrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .result-rows .rrow:last-child{border-bottom:none;}
  .result-rows .k{color:var(--dim);}
  .result-rows .v{font-weight:700;}
  .up{color:var(--up);} .dn{color:var(--dn);}
  .result-next{margin-top:20px;width:100%;background:var(--acc);color:#151515;border:none;border-radius:8px;padding:14px 0;font-weight:800;font-size:14.5px;cursor:pointer;}
  .result-menu{margin-top:10px;width:100%;background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:11px 0;font-size:12.5px;cursor:pointer;}

  #toast-container{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;}
  .toast{background:rgba(22,26,30,.94);border:1px solid var(--line);color:var(--txt);padding:8px 16px;border-radius:20px;font-size:12.5px;opacity:0;transform:translateY(-6px);transition:opacity .18s ease,transform .18s ease;}
  .toast.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>
<div id="app">

  <section id="screen-menu" class="screen active">
    <div class="menu-wrap">
      <div class="menu-title">했제와 그랬제</div>
      <div class="menu-sub">그때 샀으면 했제.<br>근데 니는 안 샀제. 그랬제.</div>
      <div class="balance-card">
        <div>
          <div class="lbl">현재 잔고</div>
          <div class="val mono" id="menu-balance">1,000원</div>
        </div>
        <div class="badge mono" id="menu-progress">0 / 5</div>
      </div>
      <div class="scenario-list" id="scenario-list"></div>

  <section id="screen-game" class="screen">
    <div class="game-header">
      <button class="backbtn" id="btn-back">← 메뉴</button>

      <div class="price mono" id="hdr-price">-</div>
      <div class="pct mono" id="hdr-pct">-</div>
      <div class="spacer"></div>
      <div class="speedbtns">
        <button data-speed="1" class="active">1x</button>
        <button data-speed="2">2x</button>

      </div>
    </div>
    <div class="game-main" id="game-main">
      <div class="chart-wrap" id="chart-wrap">
        <canvas id="chart"></canvas>
        <div class="flash" id="flash"></div>
      </div>
      <div class="chat-panel">
        <div class="chat-head"><span>코인갤러리</span><b class="mono" id="chat-online">접속 1847</b></div>
        <div class="chat-list" id="chat-list"></div>
      </div>
    </div>
    <div class="pos-bar">
      <div class="pos-info">
        <span class="side-tag none mono" id="pos-side">포지션 없음</span>
        <span class="item mono" id="pos-entry"></span>
        <span class="item mono" id="pos-margin"></span>
        <span class="item mono" id="pos-pnl"></span>
      </div>
      <div class="lev-row">
        <span style="color:var(--dim);font-size:11.5px;">레버리지</span>
        <input type="range" id="lev-slider" min="1" max="100" value="10">
        <span class="levval mono" id="lev-val">10x</span>
      </div>
      <div class="pct-row">
        <button data-pct="10">10%</button>
        <button data-pct="25" class="active">25%</button>
        <button data-pct="50">50%</button>
        <button data-pct="100">전액</button>
      </div>
      <div class="action-row">
        <button class="btn-long" id="btn-long">롱</button>
        <button class="btn-close" id="btn-flat" disabled>청산</button>
        <button class="btn-short" id="btn-short">숏</button>
      </div>
    </div>
  </section>

  <section id="screen-result" class="screen">
    <div class="result-card">
      <h2 id="res-title">시나리오 결과</h2>
      <div class="result-grade">
        <div class="g mono" id="res-grade" style="color:var(--acc);">B</div>
        <div class="comment" id="res-comment"></div>
      </div>
      <div class="result-rows">
        <div class="rrow"><span class="k">최종 잔고</span><span class="v mono" id="res-balance"></span></div>
        <div class="rrow"><span class="k">손익</span><span class="v mono" id="res-pnl"></span></div>
        <div class="rrow"><span class="k">진입 횟수</span><span class="v mono" id="res-entries"></span></div>
        <div class="rrow"><span class="k">최대 레버리지</span><span class="v mono" id="res-maxlev"></span></div>
        <div class="rrow"><span class="k">누적 수수료</span><span class="v mono" id="res-fees"></span></div>
      </div>
      <button class="result-next" id="res-next">다음 시나리오</button>
      <button class="result-menu" id="res-menu">메뉴로</button>
    </div>
  </section>

</div>
<div id="toast-container"></div>

<script>
(function(){
"use strict";

/* ===================== 상수 ===================== */
var FEE = 0.00055, MMR = 0.005, FUNDING_RATE = 0.0001, FUNDING_INTERVAL = 40;
var BAR_MS = 1150, TICKS_PER_BAR = 32, VISIBLE_BARS = 70;

var SCENARIOS = [
  {id:'psk', name:'박상기의 난', date:'2018.01.11', seed:1177, bars:170, vol:0.012,
   path:[14200,14900,13400,12100,13000,10900,10300],
   desc:'법무부 장관이 거래소 폐쇄를 검토한다고 말했다. 김치 프리미엄이 그날로 증발했다.'},
  {id:'covid', name:'코로나 블랙 목요일', date:'2020.03.12', seed:2020, bars:180, vol:0.019,
   path:[7900,7700,6400,5200,4100,4900,5300],
   desc:'전 세계 증시가 동시에 무너지던 날, 비트코인도 같이 무너졌다. 디커플링은 없었다.'},
  {id:'elon', name:'일론 트윗 대학살', date:'2021.05.19', seed:519, bars:175, vol:0.016,
   path:[43800,42000,38500,34000,29900,36500,34800],
   desc:'일론 머스크의 트윗 한 줄에 반토막. 자체 발광하던 불장이 그렇게 꺼졌다.'},
  {id:'luna', name:'루나 사태', date:'2022.05.11', seed:504, bars:185, vol:0.014,
   path:[34000,31500,29800,26900,29000,25500,26800],
   desc:'테라·루나가 하루아침에 0원이 됐다. 비트코인도 그 불길을 피하지 못했다.'},
  {id:'ftx', name:'FTX 파산', date:'2022.11.09', seed:1109, bars:175, vol:0.015,
   path:[20600,20100,18300,17400,15600,16800,16400],
   desc:'세계 3대 거래소가 일주일 만에 파산했다. 믿었던 도끼에 발등 찍힌 날.'}
];
SCENARIOS.forEach(function(s){ s.dropPct = Math.round((Math.min.apply(null,s.path)-s.path[0])/s.path[0]*100); });

var CHAT_LINES = ['가즈아','존버는 승리한다','손절각인데','물타기 가자','숏치고 지방간다','상폐각','고점매수 인증','저점매수 성공함','치킨값 날아감','내 코인만 빨간불','형들 나 이자 나가리됨','바닥은 없다','청산맵 어디감','떡상 가나요','롱치고 숏 당함','물렸습니다 도와주세요','국장 가즈아','풀매수 간다','이거 사면 오르나요','반대로만 하면 부자됨'];
var CHAT_NICK = ['ㅇㅇ','ㅁㅊ','ㅋㅋ','개미','존버맨','청산왕','ㅂㅅ','익명','국장러','물린놈'];

/* ===================== 상태 ===================== */
var appState = { balance:1000, progress:0 };
var G = null; // 진행중인 게임 세션

/* ===================== 유틸 ===================== */
function fmtPrice(p){
  return p.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
}
function fmtWon(n){
  return Math.round(n).toLocaleString('en-US')+'원';
}
function fmtWonSigned(n){
  var r = Math.round(n);
  return (r>=0?'+':'')+r.toLocaleString('en-US')+'원';
}
function fmtPct(n){
  return (n>=0?'+':'')+n.toFixed(2)+'%';
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* ===================== 시드 랜덤 ===================== */
function mulberry32(seed){
  var s = seed>>>0;
  return function(){
    s = (s + 0x6D2B79F5)>>>0;
    var t = s;
    t = Math.imul(t ^ (t>>>15), t | 1);
    t = (t + Math.imul(t ^ (t>>>7), t | 61)) ^ t;
    return ((t ^ (t>>>14))>>>0) / 4294967296;
  };
}

function lerpPath(path,t){
  var n = path.length-1;
  var pos = clamp(t,0,1)*n;
  var i = Math.min(Math.floor(pos), n-1);
  var frac = pos-i;
  return path[i] + (path[i+1]-path[i])*frac;
}

/* ===================== 봉 생성 ===================== */
function generateBars(scenario){
  var r = mulberry32(scenario.seed);
  var n = scenario.bars, vol = scenario.vol, path = scenario.path;
  var dev = 0, prev = path[0];
  var bars = [];
  for (var i=0;i<n;i++){
    var t = i/(n-1);
    var base = lerpPath(path,t);
    dev = dev*0.87 + (r()*2-1)*vol;
    var close = base*(1+dev);
    var open = prev;
    var body = Math.abs(close-open);
    var high = Math.max(open,close) + body*r()*0.9 + base*vol*r()*0.45;
    var low  = Math.min(open,close) - body*r()*0.9 - base*vol*r()*0.45;
    low = Math.max(low, base*0.05); // 안전장치: 가격이 0/음수로 붕괴하지 않도록
    var volume = (0.35+r()) * (1 + body/base*45);
    bars.push({open:open, high:high, low:low, close:close, volume:volume, base:base});
    prev = close;
  }
  return bars;
}

function generateTickPath(bar){
  var isUp = bar.close >= bar.open;
  var highFirstProb = isUp ? 0.35 : 0.65; // 양봉: 저가 먼저 65% / 음봉: 고가 먼저 65%
  var highFirst = Math.random() < highFirstProb;
  var first = highFirst ? bar.high : bar.low;
  var second = highFirst ? bar.low : bar.high;
  var N = TICKS_PER_BAR;
  var pts = [];
  var range = Math.max(bar.high-bar.low, 1e-9);
  for (var i=0;i<N;i++){
    var t = i/(N-1);
    var price;
    if (t < 1/3){
      price = bar.open + (first-bar.open)*(t/(1/3));
    } else if (t < 2/3){
      price = first + (second-first)*((t-1/3)/(1/3));
    } else {
      price = second + (bar.close-second)*((t-2/3)/(1/3));
    }
    price += (Math.random()*2-1)*range*0.06;
    price = clamp(price, bar.low, bar.high);
    pts.push(price);
  }
  pts[0] = bar.open;
  pts[N-1] = bar.close;
  return pts;
}

/* ===================== 화면 전환 ===================== */
function showScreen(name){
  ['menu','game','result'].forEach(function(k){
    document.getElementById('screen-'+k).classList.toggle('active', k===name);
  });
}

/* ===================== 메뉴 렌더 ===================== */
function renderMenu(){
  document.getElementById('menu-balance').textContent = fmtWon(appState.balance);
  document.getElementById('menu-progress').textContent = appState.progress+' / '+SCENARIOS.length;
  var list = document.getElementById('scenario-list');
  list.innerHTML = '';
  SCENARIOS.forEach(function(s, i){
    var card = document.createElement('div');
    var cleared = i < appState.progress;
    var locked = i > appState.progress;
    card.className = 'scenario-card'+(cleared?' cleared':'')+(locked?' locked':'');
    card.innerHTML =
      '<div class="row1"><span class="name">'+s.name+'</span>'+
      '<span class="dateWrap"><span class="date mono">'+s.date+'</span><span class="status mono">'+(cleared?'CLEAR':(locked?'LOCK':''))+'</span></span></div>'+
      '<div class="desc">'+s.desc+'</div>'+
      '<div class="tag mono">예상 낙폭 '+s.dropPct+'%</div>';
    if (!cleared && !locked){
      card.addEventListener('click', function(){ startScenario(i); });
    }
    list.appendChild(card);
  });
}

/* ===================== 토스트 ===================== */
function toast(msg){
  var c = document.getElementById('toast-container');
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  c.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add('show'); });
  setTimeout(function(){
    el.classList.remove('show');
    setTimeout(function(){ el.remove(); }, 220);
  }, 1500);
}

/* ===================== 채팅 ===================== */
function pushChat(nick, text){

  el.appendChild(document.createTextNode(text));
  list.appendChild(el);
  list.scrollTop = list.scrollHeight;
  while (list.children.length > 60) list.removeChild(list.firstChild);
}
function randChatTick(){
  if (!G || G.ended) return;
  pushChat(CHAT_NICK[Math.floor(Math.random()*CHAT_NICK.length)], CHAT_LINES[Math.floor(Math.random()*CHAT_LINES.length)]);
  var onlineEl = document.getElementById('chat-online');
  var cur = parseInt(onlineEl.textContent.replace(/[^0-9]/g,''),10) || 1847;
  cur = clamp(cur + Math.round((Math.random()*2-1)*30), 400, 5000);
  onlineEl.textContent = '접속 '+cur;
  G.chatTimer = setTimeout(randChatTick, 1200+Math.random()*1800);
}
function chatExplosion(){
  pushChat('ㅁㅊ','청산됨 ㅋㅋㅋㅋㅋㅋ');
  pushChat('ㅇㅇ','장송곡 울려라');

function clearChat(){

}

/* ===================== 게임 시작 ===================== */
function startScenario(idx){
  var scenario = SCENARIOS[idx];
  var bars = generateBars(scenario);
  if (G && G.chatTimer) clearTimeout(G.chatTimer);
  G = {
    scenario: scenario, idx: idx, bars: bars,
    barIndex: 0, progress: 0,
    ticks: generateTickPath(bars[0]),
    sessionHigh: bars[0].open, sessionLow: bars[0].open,
    currentPrice: bars[0].open,
    speed: 1,
    position: null,
    entryCount: 0, maxLeverage: 0, totalFees: 0,
    startBalance: appState.balance,
    yMin: null, yMax: null,
    lastTs: null, ended: false,
    selectedPct: 25, selectedLev: 10,
    chatTimer: null, mouse: null
  };
  clearChat();
  document.getElementById('lev-slider').value = 10;
  document.getElementById('lev-val').textContent = '10x';
  document.querySelectorAll('.pct-row button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-pct')==='25'); });
  document.querySelectorAll('.speedbtns button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-speed')==='1'); });
  updatePositionUI();
  showScreen('game');
  resizeCanvas();
  requestAnimationFrame(loop);
  randChatTick();
}

/* ===================== 트레이딩 로직 ===================== */
function enterPosition(side){
  if (!G || G.ended || G.position) return;
  var lev = G.selectedLev, pct = G.selectedPct;
  var margin = Math.floor(appState.balance*pct/100);
  if (margin < 1){ toast('잔고가 부족합니다'); return; }
  var entryPrice = G.currentPrice;
  var notional = margin*lev;
  var fee = notional*FEE;
  var qty = notional/entryPrice;
  var liqPrice = side==='long' ? entryPrice*(1-1/lev+MMR) : entryPrice*(1+1/lev-MMR);
  appState.balance -= margin;
  G.position = {side:side, entryPrice:entryPrice, qty:qty, leverage:lev, notional:notional, liqPrice:liqPrice, margin: margin-fee};
  G.entryCount++;
  G.maxLeverage = Math.max(G.maxLeverage, lev);
  G.totalFees += fee;
  toast((side==='long'?'롱':'숏')+' 진입 '+lev+'x');
  updatePositionUI();
}

function positionPnl(){
  if (!G.position) return 0;
  var p = G.position;
  return (G.currentPrice-p.entryPrice)*p.qty*(p.side==='long'?1:-1);
}

function closePosition(auto){
  if (!G.position) return;
  var p = G.position;
  var pnl = positionPnl();
  var fee = p.qty*G.currentPrice*FEE;
  G.totalFees += fee;
  var ret = Math.max(0, p.margin+pnl-fee);
  appState.balance += ret;
  if (!auto) toast('청산: '+fmtWon(ret)+' 회수');
  G.position = null;
  updatePositionUI();
}

function checkLiquidation(){
  if (!G.position || G.ended) return;
  var p = G.position;
  var pnl = positionPnl();
  var maintenance = p.notional*MMR;
  var breached = p.side==='long' ? (G.currentPrice<=p.liqPrice) : (G.currentPrice>=p.liqPrice);
  if (breached || (p.margin+pnl) <= maintenance){
    liquidatePosition();
  }
}

function liquidatePosition(){
  G.position = null;
  flashRed();
  toast('강제 청산!');
  chatExplosion();
  updatePositionUI();
  if (appState.balance < 10){
    G.ended = true;
    if (G.chatTimer) clearTimeout(G.chatTimer);
    setTimeout(function(){ gameOverScreen(); }, 900);
  }
}

function flashRed(){
  var el = document.getElementById('flash');
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 120);
}

/* ===================== 프레임 진행 ===================== */
function updateCurrentPrice(){
  var N = G.ticks.length;
  var pos = clamp(G.progress,0,1)*(N-1);
  var i0 = Math.floor(pos), i1 = Math.min(i0+1,N-1);
  var frac = pos-i0;
  var price = G.ticks[i0] + (G.ticks[i1]-G.ticks[i0])*frac;
  G.currentPrice = price;
  G.sessionHigh = Math.max(G.sessionHigh, price);
  G.sessionLow = Math.min(G.sessionLow, price);
}

function finalizeBar(){
  var bar = G.bars[G.barIndex];
  G.currentPrice = bar.close;
  G.barIndex++;
  if (G.position && (G.barIndex % FUNDING_INTERVAL === 0)){
    var fundingFee = G.position.notional*FUNDING_RATE;
    G.position.margin -= fundingFee;
    G.totalFees += fundingFee;
    toast('펀딩비 -'+Math.round(fundingFee).toLocaleString()+'원');
  }
  checkLiquidation();
  if (G.ended) return;
  if (G.barIndex >= G.bars.length){
    endScenario();
    return;
  }
  var nb = G.bars[G.barIndex];
  G.sessionHigh = nb.open; G.sessionLow = nb.open;
  G.ticks = generateTickPath(nb);
}

function advance(dt){
  var durMs = BAR_MS/G.speed;
  G.progress += dt/durMs;
  var guard = 0;
  while (G.progress >= 1 && !G.ended && guard < 50){
    finalizeBar();
    guard++;
    if (G.ended) return;
    G.progress -= 1;
  }
  if (G.ended) return;
  updateCurrentPrice();
  checkLiquidation();
}

function loop(ts){
  if (!G || G.ended) return;
  if (G.lastTs === null) G.lastTs = ts;
  var dt = Math.min(ts-G.lastTs, 100);
  G.lastTs = ts;
  advance(dt);
  if (!G || G.ended) { render(); return; }
  render();
  requestAnimationFrame(loop);
}

/* ===================== 결과 ===================== */
function endScenario(){
  G.ended = true;
  if (G.chatTimer) clearTimeout(G.chatTimer);
  if (G.position) closePosition(true);
  var pnl = appState.balance - G.startBalance;
  var pnlPct = G.startBalance>0 ? pnl/G.startBalance*100 : 0;
  appState.progress++;
  showResult({
    scenario: G.scenario, balance: appState.balance, pnl: pnl, pnlPct: pnlPct,
    entryCount: G.entryCount, maxLeverage: G.maxLeverage, totalFees: G.totalFees,
    gameOver: false, isFinal: appState.progress >= SCENARIOS.length
  });
}

function gameOverScreen(){
  showResult({
    scenario: G.scenario, balance: appState.balance, pnl: appState.balance-G.startBalance,
    pnlPct: G.startBalance>0 ? (appState.balance-G.startBalance)/G.startBalance*100 : -100,
    entryCount: G.entryCount, maxLeverage: G.maxLeverage, totalFees: G.totalFees,
    gameOver: true, isFinal: false
  });
}

function getGrade(pnlPct, gameOver){
  if (gameOver) return {g:'F', label:'청산의 노예', c:'청산당했제? 그럴 줄 알았다. 했제 안 했제, 이제 다 필요없다.', color:'var(--dn)'};
  if (pnlPct >= 80)  return {g:'S', c:'그래 니가 진짜 샀네. 인정한다.', color:'var(--acc)'};
  if (pnlPct >= 30)  return {g:'A', c:'오 좀 치네. 그란데 방심하지 마라.', color:'var(--up)'};
  if (pnlPct >= 5)   return {g:'B', c:'살아는 남았다. 그게 어디고.', color:'var(--up)'};
  if (pnlPct >= -20) return {g:'C', c:'낙폭보다 니 멘탈이 더 빠졌겠다.', color:'var(--dim)'};
  if (pnlPct >= -60) return {g:'D', c:'그러게 내가 뭐랬노. 반토막 그랬제.', color:'var(--dn)'};
  return {g:'F', c:'거의 다 날렸다. 그래도 살긴 살았제.', color:'var(--dn)'};
}

function showResult(data){
  var grade = getGrade(data.pnlPct, data.gameOver);
  document.getElementById('res-title').textContent = data.gameOver ? '게임 오버 — '+data.scenario.name : (data.isFinal ? '전체 클리어! — '+data.scenario.name : data.scenario.name+' 결과');
  var gEl = document.getElementById('res-grade');
  gEl.textContent = grade.g;
  gEl.style.color = grade.color;
  document.getElementById('res-comment').textContent = grade.c;
  document.getElementById('res-balance').textContent = fmtWon(data.balance);
  var pnlEl = document.getElementById('res-pnl');
  pnlEl.textContent = fmtWonSigned(data.pnl)+' ('+fmtPct(data.pnlPct)+')';
  pnlEl.className = 'v mono '+(data.pnl>=0?'up':'dn');
  document.getElementById('res-entries').textContent = data.entryCount+'회';
  document.getElementById('res-maxlev').textContent = data.maxLeverage+'x';
  document.getElementById('res-fees').textContent = fmtWon(data.totalFees);

  var nextBtn = document.getElementById('res-next');
  var menuBtn = document.getElementById('res-menu');
  if (data.gameOver){
    nextBtn.textContent = '처음부터 다시';
    nextBtn.onclick = function(){ appState.balance=1000; appState.progress=0; showScreen('menu'); renderMenu(); };
  } else if (data.isFinal){
    nextBtn.textContent = '새 판 시작';
    nextBtn.onclick = function(){ appState.balance=1000; appState.progress=0; showScreen('menu'); renderMenu(); };
  } else {
    nextBtn.textContent = '다음 시나리오 → '+SCENARIOS[appState.progress].name;
    nextBtn.onclick = function(){ startScenario(appState.progress); };
  }
  menuBtn.onclick = function(){ showScreen('menu'); renderMenu(); };
  showScreen('result');
}

/* ===================== 차트 렌더링 ===================== */
var canvas = document.getElementById('chart');
var ctx = canvas.getContext('2d');
var chartCssW = 0, chartCssH = 0;

function resizeCanvas(){
  var wrap = document.getElementById('chart-wrap');
  var rect = wrap.getBoundingClientRect();
  var dpr = window.devicePixelRatio || 1;
  chartCssW = Math.max(1,Math.round(rect.width));
  chartCssH = Math.max(1,Math.round(rect.height));
  canvas.width = chartCssW*dpr;
  canvas.height = chartCssH*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if (G) render();
}
window.addEventListener('resize', resizeCanvas);

function getVisibleBars(){
  if (!G) return [];
  var out = [];
  var startIdx = Math.max(0, G.barIndex - VISIBLE_BARS + (G.barIndex<G.bars.length?1:0));
  for (var i=startIdx; i<G.barIndex; i++) out.push(G.bars[i]);
  if (G.barIndex < G.bars.length){
    var live = G.bars[G.barIndex];
    out.push({
      open: live.open, high: G.sessionHigh, low: G.sessionLow, close: G.currentPrice,
      volume: live.volume*clamp(G.progress,0,1)
    });
  }
  return out;
}

function getCloseSeriesUpTo(count){
  var arr = [];
  var startIdx = Math.max(0, G.barIndex - count + 1);
  for (var i=startIdx; i<G.barIndex; i++) arr.push(G.bars[i].close);
  if (G.barIndex < G.bars.length) arr.push(G.currentPrice);
  return arr;
}

function movingAverage(n){
  // 표시 중인 구간에 대응하는 MA값 배열 (visible bars와 동일 길이)
  var visCount = Math.min(VISIBLE_BARS, G.barIndex + (G.barIndex<G.bars.length?1:0));
  var totalCount = G.barIndex + (G.barIndex<G.bars.length?1:0);
  var closes = [];
  for (var i=0;i<G.barIndex;i++) closes.push(G.bars[i].close);
  if (G.barIndex < G.bars.length) closes.push(G.currentPrice);
  var res = [];
  var offset = totalCount - visCount;
  for (var v=0; v<visCount; v++){
    var idx = offset+v;
    var s = Math.max(0, idx-n+1);
    var slice = closes.slice(s, idx+1);
    var sum=0; for (var k=0;k<slice.length;k++) sum+=slice[k];
    res.push(sum/slice.length);
  }
  return res;
}

function render(){
  if (!G) return;
  updateHeader();
  updatePositionUI();
  var bars = getVisibleBars();
  if (bars.length===0) return;

  var axisW = chartCssW < 480 ? 50 : 62;
  var bottomM = 20;
  var volH = chartCssH < 380 ? 38 : 52;
  var plotX0 = 0, plotX1 = chartCssW-axisW;
  var priceY0 = 0, priceY1 = chartCssH-bottomM-volH-4;
  var volY0 = priceY1+4, volY1 = chartCssH-bottomM;

  ctx.clearRect(0,0,chartCssW,chartCssH);
  ctx.fillStyle = '#0b0e11';
  ctx.fillRect(0,0,chartCssW,chartCssH);

  var barW = (plotX1-plotX0)/VISIBLE_BARS;
  var bodyW = Math.max(1, barW*0.62);

  var hi=-Infinity, lo=Infinity;
  bars.forEach(function(b){ hi=Math.max(hi,b.high); lo=Math.min(lo,b.low); });
  if (!isFinite(hi) || !isFinite(lo) || hi===lo){ hi=lo+1; lo=lo-1; }
  var range = hi-lo;
  var targetMax = hi + range*0.09;
  var targetMin = lo - range*0.09;
  if (G.yMin===null){ G.yMin=targetMin; G.yMax=targetMax; }
  G.yMin += (targetMin-G.yMin)*0.12;
  G.yMax += (targetMax-G.yMax)*0.12;
  var yMin=G.yMin, yMax=G.yMax;

  function mapY(price){
    return priceY0 + (yMax-price)/(yMax-yMin)*(priceY1-priceY0);
  }
  function xAt(i){ return plotX0 + i*barW; }

  // 가로 그리드 + 가격 라벨
  ctx.strokeStyle = 'rgba(43,49,57,0.7)';
  ctx.fillStyle = '#848e9c';
  ctx.font = '10px monospace';
  ctx.lineWidth = 1;
  var gridN = 6;
  for (var g=0; g<=gridN; g++){
    var py = priceY0 + (priceY1-priceY0)*(g/gridN);
    ctx.beginPath();
    ctx.moveTo(plotX0, py+0.5);
    ctx.lineTo(plotX1, py+0.5);
    ctx.stroke();
    var priceVal = yMax - (yMax-yMin)*(g/gridN);
    ctx.fillText(fmtPrice(priceVal), plotX1+4, py+3);
  }

  // 볼륨
  var maxVol = 0;
  bars.forEach(function(b){ maxVol=Math.max(maxVol,b.volume); });
  bars.forEach(function(b,i){
    var cx = xAt(i)+barW/2;
    var up = b.close>=b.open;
    ctx.fillStyle = up ? 'rgba(32,178,108,0.42)' : 'rgba(239,69,74,0.42)';
    var h = maxVol>0 ? (b.volume/maxVol)*(volY1-volY0) : 0;
    ctx.fillRect(cx-bodyW/2, volY1-h, bodyW, h);
  });

  // MA
  function drawMA(n, color){
    var ma = movingAverage(n);
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.75;
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    var offset = bars.length - ma.length;
    for (var i=0;i<ma.length;i++){
      var cx = xAt(offset+i)+barW/2;
      var cy = mapY(ma[i]);
      if (i===0) ctx.moveTo(cx,cy); else ctx.lineTo(cx,cy);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  drawMA(7, '#f7a600');
  drawMA(25, '#8b5cf6');

  // 캔들
  bars.forEach(function(b,i){
    var cx = xAt(i)+barW/2;
    var up = b.close >= b.open;
    var color = up ? '#20b26c' : '#ef454a';
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx, mapY(b.high));
    ctx.lineTo(cx, mapY(b.low));
    ctx.stroke();
    var top = mapY(Math.max(b.open,b.close));
    var bot = mapY(Math.min(b.open,b.close));
    var h = Math.max(1, bot-top);
    ctx.fillRect(cx-bodyW/2, top, bodyW, h);
  });

  // 진입가 / 청산가 라인
  if (G.position){
    var p = G.position;
    drawDashLine(mapY(p.entryPrice), '#f7a600', plotX0, plotX1);
    ctx.fillStyle = '#f7a600';
    ctx.font = 'bold 10px monospace';
    ctx.fillText('진입 '+fmtPrice(p.entryPrice), plotX0+4, mapY(p.entryPrice)-4);

    drawDashLine(mapY(p.liqPrice), '#ef454a', plotX0, plotX1);
    ctx.fillStyle = '#ef454a';
    ctx.fillText('청산 '+fmtPrice(p.liqPrice), plotX0+4, mapY(p.liqPrice)-4);
  }

  // 현재가 라인 + 라벨
  var curY = mapY(G.currentPrice);
  var curColor = G.currentPrice >= bars[bars.length-1].open ? '#20b26c' : '#ef454a';
  drawDashLine(curY, 'rgba(234,236,239,0.55)', plotX0, plotX1);
  ctx.fillStyle = curColor;
  ctx.fillRect(plotX1, curY-8, axisW, 16);
  ctx.fillStyle = '#0b0e11';
  ctx.font = 'bold 10px monospace';
  ctx.fillText(fmtPrice(G.currentPrice), plotX1+4, curY+3);

  // 크로스헤어
  if (G.mouse && G.mouse.x>=plotX0 && G.mouse.x<=plotX1 && G.mouse.y>=priceY0 && G.mouse.y<=priceY1){
    ctx.strokeStyle = 'rgba(132,142,156,0.6)';
    ctx.setLineDash([3,3]);
    ctx.beginPath();
    ctx.moveTo(G.mouse.x+0.5, priceY0); ctx.lineTo(G.mouse.x+0.5, priceY1);
    ctx.moveTo(plotX0, G.mouse.y+0.5); ctx.lineTo(plotX1, G.mouse.y+0.5);
    ctx.stroke();
    ctx.setLineDash([]);
    var hoverPrice = yMax - (G.mouse.y-priceY0)/(priceY1-priceY0)*(yMax-yMin);
    ctx.fillStyle = '#e2e5e8';
    ctx.fillRect(plotX1, G.mouse.y-8, axisW, 16);
    ctx.fillStyle = '#0b0e11';
    ctx.fillText(fmtPrice(hoverPrice), plotX1+4, G.mouse.y+3);
  }

  // 하단 시간 라벨
  ctx.fillStyle = '#848e9c';
  ctx.font = '10px monospace';
  var baseTime = new Date(G.scenario.date.replace(/\./g,'-')+'T09:00:00+09:00').getTime();
  var offsetIdx = G.barIndex + (G.barIndex<G.bars.length?1:0) - bars.length;
  var step = Math.max(1, Math.round(bars.length/5));
  for (var li=0; li<bars.length; li+=step){
    var t = new Date(baseTime + (offsetIdx+li)*15*60000);
    var label = ('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);
    ctx.fillText(label, xAt(li), chartCssH-6);
  }
}

function drawDashLine(y, color, x0, x1){
  ctx.strokeStyle = color;
  ctx.setLineDash([4,4]);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x0, y+0.5);
  ctx.lineTo(x1, y+0.5);
  ctx.stroke();
  ctx.setLineDash([]);
}

/* ===================== 이벤트 바인딩 ===================== */
canvas.addEventListener('mousemove', function(e){
  if (!G) return;
  var rect = canvas.getBoundingClientRect();
  G.mouse = {x:e.clientX-rect.left, y:e.clientY-rect.top};
});
canvas.addEventListener('mouseleave', function(){ if (G) G.mouse = null; });

document.getElementById('btn-back').addEventListener('click', function(){
  if (G && G.chatTimer) clearTimeout(G.chatTimer);
  if (G) G.ended = true;
  showScreen('menu'); renderMenu();
});

document.querySelectorAll('.speedbtns button').forEach(function(btn){
  btn.addEventListener('click', function(){
    if (!G) return;
    document.querySelectorAll('.speedbtns button').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    G.speed = parseInt(btn.getAttribute('data-speed'),10);
  });
});

document.querySelectorAll('.pct-row button').forEach(function(btn){
  btn.addEventListener('click', function(){
    if (!G) return;
    document.querySelectorAll('.pct-row button').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    G.selectedPct = parseInt(btn.getAttribute('data-pct'),10);
  });
});

document.getElementById('lev-slider').addEventListener('input', function(e){
  if (!G) return;
  G.selectedLev = parseInt(e.target.value,10);
  document.getElementById('lev-val').textContent = G.selectedLev+'x';
});

document.getElementById('btn-long').addEventListener('click', function(){ enterPosition('long'); });
document.getElementById('btn-short').addEventListener('click', function(){ enterPosition('short'); });
document.getElementById('btn-flat').addEventListener('click', function(){ if (G && G.position) closePosition(false); });

/* ===================== 초기화 ===================== */
renderMenu();
window.addEventListener('resize', function(){ if (document.getElementById('screen-game').classList.contains('active')) resizeCanvas(); });

})();
</script>
</body>
</html>
