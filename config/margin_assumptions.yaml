# Default cost/fee assumptions for the landed-cost/margin calculator
# (packages/scoring/margin.py). These are editable placeholder assumptions,
# not fetched from a live source — docs/MASTER_SPEC.md §16 requires every
# assumption to be configurable, not hardcoded. jpy_krw_fx in particular is a
# static illustrative rate; a live FX connector is Phase 2 scope
# (docs/ROADMAP.md) — until then this number is exactly what it looks like:
# an assumption, not an observed Fact, and it is never stored as one.
jpy_krw_fx: 9.30

# Shipping figures assume a consolidated batch import (many SKUs per
# shipment, cost amortized per unit) rather than shipping one item alone —
# that amortization assumption is itself worth surfacing to the user, since
# a single-unit "just try one" purchase would face much higher effective
# per-unit shipping than this default reflects.
japan_domestic_shipping_jpy: 200
international_shipping_jpy_per_unit: 300
forwarding_fee_jpy_per_unit: 150

customs_duty_rate: 0.08
import_vat_rate: 0.10

payment_fee_rate: 0.023
marketplace_commission_rate: 0.11
fulfillment_fee_krw_per_unit: 2500
korean_delivery_fee_krw: 3000
advertising_cost_assumption_rate: 0.08
return_allowance_rate: 0.02
other_cost_krw: 500
